<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="title">
  <title id="title">Table 1. How do students manage their money?</title>
  <rect width="640" height="280" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#002147">Table 1. How do students manage their money?</text>
  <rect x="24" y="44" width="280" height="28" fill="#002147"/>
  <rect x="304" y="44" width="96" height="28" fill="#002147"/>
  <rect x="400" y="44" width="216" height="28" fill="#002147"/>
  <text x="164" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Category</text>
  <text x="352" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">%</text>
  <text x="508" y="63" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Notes</text>
  <rect x="24" y="72" width="280" height="32" fill="#ffffff" stroke="#002147"/>
  <rect x="304" y="72" width="96" height="32" fill="#ffffff" stroke="#002147"/>
  <rect x="400" y="72" width="216" height="32" fill="#ffffff" stroke="#002147"/>
  <text x="36" y="93" font-size="12" fill="#334155">Students who save regularly</text>
  <text x="352" y="93" text-anchor="middle" font-size="12" fill="#334155">45%</text>
  <text x="412" y="93" font-size="12" fill="#334155">Save at least 10% of allowance</text>
  <rect x="24" y="104" width="280" height="32" fill="#e8f0f8" stroke="#002147"/>
  <rect x="304" y="104" width="96" height="32" fill="#e8f0f8" stroke="#002147"/>
  <rect x="400" y="104" width="216" height="32" fill="#e8f0f8" stroke="#002147"/>
  <text x="36" y="125" font-size="12" fill="#334155">Students who track expenses</text>
  <text x="352" y="125" text-anchor="middle" font-size="12" fill="#334155">35%</text>
  <text x="412" y="125" font-size="12" fill="#334155">Use apps or notes</text>
  <rect x="24" y="136" width="280" height="32" fill="#ffffff" stroke="#002147"/>
  <rect x="304" y="136" width="96" height="32" fill="#ffffff" stroke="#002147"/>
  <rect x="400" y="136" width="216" height="32" fill="#ffffff" stroke="#002147"/>
  <text x="36" y="157" font-size="12" fill="#334155">Students with financial education</text>
  <text x="352" y="157" text-anchor="middle" font-size="12" fill="#334155">25%</text>
  <text x="412" y="157" font-size="12" fill="#334155">Have learned budgeting in class</text>
  <rect x="24" y="168" width="280" height="32" fill="#e8f0f8" stroke="#002147"/>
  <rect x="304" y="168" width="96" height="32" fill="#e8f0f8" stroke="#002147"/>
  <rect x="400" y="168" width="216" height="32" fill="#e8f0f8" stroke="#002147"/>
  <text x="36" y="189" font-size="12" fill="#334155">Students who often borrow from friends</text>
  <text x="352" y="189" text-anchor="middle" font-size="12" fill="#334155">30%</text>
  <text x="412" y="189" font-size="12" fill="#334155">Due to running out of money</text>
  <rect x="24" y="200" width="280" height="32" fill="#ffffff" stroke="#002147"/>
  <rect x="304" y="200" width="96" height="32" fill="#ffffff" stroke="#002147"/>
  <rect x="400" y="200" width="216" height="32" fill="#ffffff" stroke="#002147"/>
  <text x="36" y="221" font-size="12" fill="#334155">Students who spend most on food &amp; drinks</text>
  <text x="352" y="221" text-anchor="middle" font-size="12" fill="#334155">50%</text>
  <text x="412" y="221" font-size="12" fill="#334155">Largest category of spending</text>
  <rect x="24" y="232" width="280" height="32" fill="#e8f0f8" stroke="#002147"/>
  <rect x="304" y="232" width="96" height="32" fill="#e8f0f8" stroke="#002147"/>
  <rect x="400" y="232" width="216" height="32" fill="#e8f0f8" stroke="#002147"/>
  <text x="36" y="253" font-size="12" fill="#334155">Students who plan</text>
  <text x="352" y="253" text-anchor="middle" font-size="12" fill="#334155">28%</text>
  <text x="412" y="253" font-size="12" fill="#334155">Usually better savers</text>
</svg>
