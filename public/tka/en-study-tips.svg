<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Effective Study Techniques</title>
  <desc id="desc">Infographic of time management and self management study techniques, ending with a five-step sequence.</desc>
  <rect width="640" height="420" fill="#ffffff"/>
  <text x="320" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#002147">Effective Study Techniques</text>
  <rect x="24" y="56" width="288" height="248" fill="#e8f0f8" stroke="#002147" stroke-width="1"/>
  <rect x="328" y="56" width="288" height="248" fill="#fff7e6" stroke="#002147" stroke-width="1"/>
  <text x="168" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#002147">Time Management</text>
  <text x="472" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#002147">Self Management</text>
  <text x="40" y="128" font-size="13" fill="#334155">" Use the Pomodoro Technique</text>
  <text x="40" y="152" font-size="13" fill="#334155">  to stay focused and fresh</text>
  <text x="40" y="188" font-size="13" fill="#334155">" Set a timetable</text>
  <text x="40" y="224" font-size="13" fill="#334155">" Keep a consistent study schedule</text>
  <text x="344" y="128" font-size="13" fill="#334155">" Know your learning style</text>
  <text x="344" y="164" font-size="13" fill="#334155">" Find a quiet area</text>
  <text x="344" y="200" font-size="13" fill="#334155">" Use less gadgets</text>
  <text x="344" y="236" font-size="13" fill="#334155">" Be patient and persistent</text>
  <text x="344" y="272" font-size="13" fill="#334155">" Practice and repeat</text>
  <rect x="24" y="320" width="592" height="76" fill="#002147"/>
  <text x="320" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Suggested sequence</text>
  <text x="320" y="376" text-anchor="middle" font-size="13" fill="#ffffff">Know your learning style ’ Find a quiet area ’ Set a timetable ’ Use less gadgets ’ Be patient and persistent</text>
</svg>
